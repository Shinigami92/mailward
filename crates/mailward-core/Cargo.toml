[package]
name = "mailward-core"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "mailward engine: IMAP, auth, rule DSL and YAML config model"

[dependencies]
async-imap = "0.11.2"
base64 = "0.22.1"
chrono = "0.4.45"
futures = "0.3.32"
mail-parser = "0.11.3"
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
regex = "1.12.3"
serde = { workspace = true }
serde_json = "1.0.150"
serde_yaml_ng = "0.10.0"
thiserror = "2.0.18"
tokio = { workspace = true }
tokio-rustls = "0.26.4"
tokio-util = { version = "0.7.18", features = ["compat"] }
url = "2.5.8"
utf7-imap = "0.3.2"
webpki-roots = "1.0.7"

[dev-dependencies]
insta = "1.47.2"
