<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>mailward</title>
    <!-- Apply the saved/system theme before first paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("mailward-theme");
          var systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = saved === "dark" || ((saved === null || saved === "auto") && systemDark);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
